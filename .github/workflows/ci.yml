name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Demo-mode build (no secrets in CI): proves the app builds without a database.
      - run: npm run build
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Seed and end-to-end smoke test
    runs-on: ubuntu-latest
    needs: checks
    env:
      DEMO_USER_PASSWORD: ci-demo-password-2026
      MONGODB_URI: mongodb://127.0.0.1:27099/skillarena?replicaSet=testset
      MONGODB_DB: skillarena
      BETTER_AUTH_URL: http://localhost:3000
      CRON_SECRET: ci-cron-value-not-used-in-production
      BASE_URL: http://localhost:3000
      # Skip the live Remotive/Arbeitnow/GitHub/Codeforces calls on every push.
      SMOKE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run test:seed
      - name: Generate a throwaway auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start the in-memory database (seeded)
        run: |
          nohup npm run dev:memory-db > memory-db.log 2>&1 &
          for i in $(seq 1 60); do grep -q "Press Ctrl+C" memory-db.log && break; sleep 2; done
          cat memory-db.log
      # Built with the database settings present, like a real deploy.
      - run: npm run build
      - name: Start the production server
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$BASE_URL/api/health" && break; sleep 2; done
      - run: npm run test:smoke
      - name: Server log
        if: always()
        run: cat server.log || true
